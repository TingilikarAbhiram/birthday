<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday SREE ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="page">

        <!-- Background -->
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

        <div id="particles"></div>
        <div id="hearts"></div>


        <!-- Birthday Card -->
        <div class="birthday-card" id="birthdayCard">

            <!-- Stars -->
            <div class="star star1">✦</div>
            <div class="star star2">✧</div>
            <div class="star star3">✦</div>
            <div class="star star4">✧</div>


            <!-- Title -->
            <div class="title-area">

                <p class="small-title">
                    A SPECIAL DAY FOR
                </p>

                <h1>
                    Happy Birthday
                </h1>

                <h2>
                    SREE <span>❤️</span>
                </h2>

            </div>


            <!-- Cake -->
            <div class="cake-wrapper">

                <!-- Flame -->
                <div class="flame-container">

                    <div class="flame"></div>

                    <div class="flame-glow"></div>

                </div>


                <!-- Candle -->
                <div class="candle">

                    <div class="candle-line"></div>

                    <div class="candle-line second"></div>

                </div>


                <!-- Cake -->
                <div class="cake">

                    <div class="cake-top">

                        <div class="cream cream1"></div>
                        <div class="cream cream2"></div>
                        <div class="cream cream3"></div>
                        <div class="cream cream4"></div>

                        <div class="cherry cherry1"></div>
                        <div class="cherry cherry2"></div>
                        <div class="cherry cherry3"></div>

                    </div>


                    <div class="cake-body">

                        <div class="cake-stripe stripe1"></div>
                        <div class="cake-stripe stripe2"></div>
                        <div class="cake-stripe stripe3"></div>

                    </div>


                    <div class="cake-bottom"></div>

                </div>

            </div>


            <!-- Message -->
            <div class="message">

                <p>
                    You're the best part in my life.
                </p>

                <div class="line"></div>

                <span>
                    Today is all about you ✨
                </span>

            </div>


            <!-- Replay -->
            <button id="replayButton">
                <span>↻</span>
                Replay
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
